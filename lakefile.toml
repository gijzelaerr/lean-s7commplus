name = "lean-s7commplus"
version = "0.0.0"
defaultTargets = ["LeanS7CommPlus"]

# lean-s7 provides the byte cursor, big-endian codecs, TPKT/COTP and the
# reverse-read and ByteArray.extract lemmas. Pinned to the lean-s7 0.3.0 release;
# lake-manifest.json records its commit.
[[require]]
name = "lean-s7"
git = "https://github.com/gijzelaerr/lean-s7"
rev = "v0.3.0"

[[lean_lib]]
name = "LeanS7CommPlus"

[[lean_exe]]
name = "lean-s7commplus-tests"
root = "Tests"

[[lean_exe]]
name = "lean-s7commplus-axioms"
root = "AxiomAuditMain"

[[lean_exe]]
name = "lean-s7commplus-cli"
root = "CliMain"

[[lean_exe]]
name = "lean-s7commplus-decode"
root = "DecodeMain"
